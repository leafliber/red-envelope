# QQ红包自动点击系统 - 配置文件

# 窗口扫描设置
window:
  # 窗口标题关键词列表，匹配任何一个即视为QQ窗口
  title_keywords:
    - "QQ"
  # 窗口扫描间隔范围（秒），每轮随机取值
  scan_interval_min: 1.0
  scan_interval_max: 3.0
  # 窗口列表缓存刷新间隔（秒）
  cache_ttl: 5.0

# 图像识别设置
detection:
  # 红包模板图片路径（相对于项目根目录）
  template_path: "img/redbag.png"
  # 模板匹配阈值（0.0 - 1.0），越高越严格
  match_threshold: 0.8
  # 匹配算法: TM_CCOEFF_NORMED (推荐), TM_CCORR_NORMED, TM_SQDIFF_NORMED
  match_method: "TM_CCOEFF_NORMED"
  # 是否启用灰度匹配（提升速度）
  grayscale: true

# 人类化操作设置
humanizer:
  # 鼠标移动时长范围（秒）
  move_duration_min: 0.05
  move_duration_max: 0.15
  # 点击位置随机偏移范围（像素）
  click_offset_x: 5
  click_offset_y: 5
  # 点击后等待时间范围（秒）
  click_wait_min: 0.1
  click_wait_max: 0.3
  # 操作间随机等待时间范围（秒）
  action_wait_min: 0.3
  action_wait_max: 0.8
  # PyAutoGUI tween 函数: easeInOutQuad, easeOutQuad, linear
  tween_function: "easeOutQuad"

# 全局快捷键设置
hotkey:
  # 暂停/继续监控快捷键 (pynput 格式)
  # macOS: <ctrl>+<shift>+p
  # 也可用: <cmd>+<shift>+p
  pause_resume: "<ctrl>+<shift>+p"

# 日志设置
logging:
  # 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"
  # 日志文件路径（相对于项目根目录），留空则不输出到文件
  file: "logs/red_envelope.log"
  # 日志文件最大大小（MB）
  max_size_mb: 10
  # 日志文件保留数量
  backup_count: 5
  # 日志格式
  format: "%(asctime)s [%(levelname)s] %(name)s - %(message)s"
